name: File creation tests

on:
  pull_request:
    paths:
      - src/tools/file_ops.py
      - tests/test_file_creation.py
      - .github/workflows/file-creation-tests.yml
  push:
    branches: [main]
    paths:
      - src/tools/file_ops.py
      - tests/test_file_creation.py
      - .github/workflows/file-creation-tests.yml

permissions:
  contents: read

jobs:
  file-creation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - run: python -m pip install fuzzywuzzy==0.18.0
      - run: python -m unittest discover -s tests -p test_file_creation.py -v
